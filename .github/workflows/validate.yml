name: Validate configuration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install validation dependencies
        run: pip install -r tests/requirements-dev.txt

      - name: Validate lab manifests
        run: python tools/validate_labs.py .

      - name: Validate Compose files
        run: |
          set -euo pipefail
          for compose in labs/week*/docker-compose.yml; do
            docker compose -f "$compose" config --quiet
            echo "compose ok: $compose"
          done

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

      - name: Compile Python
        run: python -m compileall -q backend tools tests
