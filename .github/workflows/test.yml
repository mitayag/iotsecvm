name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements-dev.txt

      - name: Validate configuration
        run: python tools/validate_labs.py .

      - name: Generate lab keys
        run: scripts/gen-lab-keys.sh week01

      - name: Build Week 1 images
        run: scripts/lab-build.sh week01

      - name: Run full test suite
        env:
          IOTLAB_SKIP_BUILD: "1"
        run: python -m pytest -v tests

      - name: Collect lab logs
        if: always()
        run: |
          docker compose -p iotlab-week01 -f labs/week01/docker-compose.yml logs --no-color > /tmp/iotlab-week01.log 2>&1 || true
          scripts/lab-status.sh week01 > /tmp/iotlab-status.txt 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week01-diagnostics
          path: |
            /tmp/iotlab-week01.log
            /tmp/iotlab-status.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop lab
        if: always()
        run: scripts/lab-stop.sh week01 || true
